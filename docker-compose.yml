services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - invoice-data:/app/data
    environment:
      # Left empty so the app owns the defaults (admin/changeme, or demo/demo
      # when DEMO_MODE=true). Set them in .env to override.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-min-32-chars}
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_INTERVAL: ${DEMO_RESET_INTERVAL:-86400000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  invoice-data:
