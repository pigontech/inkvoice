name: Bug report
description: Something in Inkvoice is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/pigontech/inkvoice/issues) first.
        **Security problems must not be reported here.** Use [private vulnerability reporting](https://github.com/pigontech/inkvoice/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Inkvoice version
      description: Release tag, Docker image tag or commit SHA.
      placeholder: "0.3.7"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running Inkvoice?
      options:
        - Docker / Docker Compose
        - Dokploy / Coolify / other PaaS template
        - Bare Bun (from source)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: Needed for frontend bugs.
      placeholder: "Firefox 140 on macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Server logs, browser console errors or screenshots. Remove any secrets or customer data first.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Reverse proxy, language/locale, invoice template, payment gateway, anything else relevant.
